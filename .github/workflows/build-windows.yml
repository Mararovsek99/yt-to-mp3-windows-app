name: Build Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create bin folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bin"

      - name: Download latest yt-dlp
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "bin\yt-dlp.exe"

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"

      - name: Extract FFmpeg
        shell: powershell
        run: |
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"

          $ffmpeg = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "ffmpeg_temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

          if (-not $ffmpeg) {
              throw "ffmpeg.exe not found"
          }

          if (-not $ffprobe) {
              throw "ffprobe.exe not found"
          }

          Copy-Item $ffmpeg.FullName "bin\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "bin\ffprobe.exe"

      - name: Verify downloaded tools
        shell: powershell
        run: |
          $ytdlpSize = (Get-Item "bin\yt-dlp.exe").Length
          $ffmpegSize = (Get-Item "bin\ffmpeg.exe").Length
          $ffprobeSize = (Get-Item "bin\ffprobe.exe").Length

          Write-Host "yt-dlp: $ytdlpSize bytes"
          Write-Host "ffmpeg: $ffmpegSize bytes"
          Write-Host "ffprobe: $ffprobeSize bytes"

          if ($ytdlpSize -lt 1000000) {
              throw "yt-dlp.exe invalid"
          }

          if ($ffmpegSize -lt 1000000) {
              throw "ffmpeg.exe invalid"
          }

          if ($ffprobeSize -lt 1000000) {
              throw "ffprobe.exe invalid"
          }

      - name: Show yt-dlp version
        shell: powershell
        run: |
          .\bin\yt-dlp.exe --version

      - name: Build application
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "YoutubeToMp3" `
            --icon "icon.ico" `
            --add-data "bin;bin" `
            app.py

      - name: Read app version
        shell: pwsh
        run: |
          $content = Get-Content version.py -Raw
          if ($content -match 'APP_VERSION\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            echo "APP_VERSION=$version" >> $env:GITHUB_ENV
            Write-Host "Building version $version"
          } else {
            throw "APP_VERSION not found in version.py"
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: powershell
        run: |
          Write-Host "Building installer version $env:APP_VERSION"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:APP_VERSION" `
            "installer\installer.iss"

      - name: Verify installer
        shell: powershell
        run: |
          if (!(Test-Path "installer\output\YoutubeToMp3-Setup.exe")) {
              throw "Installer was not created"
          }

          Get-Item "installer\output\YoutubeToMp3-Setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeToMp3-Setup
          path: installer/output/YoutubeToMp3-Setup.exe

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release version')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:APP_VERSION"
          $installer = "installer\output\YoutubeToMp3-Setup.exe"

          Write-Host "Creating release $tag"

          gh release create $tag `
            "$installer" `
            --title "YT to MP3 $tag" `
            --generate-notes
